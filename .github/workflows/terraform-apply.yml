name: Terraform Apply

on:
  push:
    branches:
      - main
      - feature/phase2-cicd-security

permissions:
  id-token: write
  contents: read

jobs:
  terraform-apply:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan -no-color

      # Terraform provisions the AWS infrastructure (VPC, IAM, EKS, IRSA, etc.).
      # Kubernetes applications are installed after Terraform completes.
      # should run before this step completes.
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/phase2-cicd-security'
        run: terraform apply -auto-approve tfplan

      # Safe from here on — cluster + access entry are guaranteed to exist
      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name project-bedrock-cluster \
            --region us-east-1

      - name: Verify Kubernetes Access
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Add EKS Helm Repository
        run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

      - name: Deploy AWS Load Balancer Controller
        run: |
          helm upgrade --install aws-load-balancer-controller \
          eks/aws-load-balancer-controller \
          --namespace kube-system \
          --create-namespace \
          --set clusterName=project-bedrock-cluster \
          --set region=us-east-1 \
          --set serviceAccount.create=true \
          --set serviceAccount.name=aws-load-balancer-controller \
          --set serviceAccount.annotations.eks\.amazonaws\.com/role-arn=arn:aws:iam::561876735341:role/alb-controller-irsa-role \
          --wait \
          --timeout 10m 
         
      - name: Debug Helm
        if: failure()
        run: |
          helm list -A
          helm status aws-load-balancer-controller -n kube-system

      - name: Verify ALB Controller
        run: |
          kubectl rollout status deployment/aws-load-balancer-controller -n kube-system
          kubectl get deployment aws-load-balancer-controller -n kube-system
          kubectl get pods -n kube-system

      - name: Debug ALB Controller
        if: failure()
        run: |
          kubectl describe deployment aws-load-balancer-controller -n kube-system || true
          kubectl describe pods -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller || true
          kubectl logs -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller --all-containers=true || true