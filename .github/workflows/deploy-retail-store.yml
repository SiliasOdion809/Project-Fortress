concurrency:
  group: deploy-retail-store
  cancel-in-progress: true

name: Deploy Retail Store

on:
  workflow_run:
    workflows: ["Terraform Apply"]
    types:
      - completed
         
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: project-fortress-cluster
  NAMESPACE: retail-app

jobs:
  prepare-environment:
    timeout-minutes: 15
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
      
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: configure kubeconfig
        run: |
          aws eks update-kubeconfig \
          --region ${{ env.AWS_REGION }} \
          --name ${{ env.CLUSTER_NAME }}

      - name: Verify Cluster Connectivity
        run: |
          kubectl cluster-info

          NODE_COUNT=$(kubectl get nodes --no-headers | wc -l)

          if [ "$NODE_COUNT" -eq 0 ]; then
            echo "❌ No Kubernetes worker nodes found."
            exit 1
          fi

          echo "✅ Kubernetes cluster is healthy."
          kubectl get nodes -o wide

      - name: Display Cluster Info
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide
          kubectl get namespaces
          kubectl get pods --all-namespaces


  validate-infrastructure:
    timeout-minutes: 15
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    needs: prepare-environment

    runs-on: ubuntu-latest

    outputs:
      mysql_endpoint: ${{ steps.terraform_outputs.outputs.mysql_endpoint }}
      postgres_endpoint: ${{ steps.terraform_outputs.outputs.postgres_endpoint }}
      dynamodb_table: ${{ steps.terraform_outputs.outputs.dynamodb_table }}

      mysql_username: ${{ steps.terraform_outputs.outputs.mysql_username }}

      mysql_secret_arn: ${{ steps.terraform_outputs.outputs.mysql_secret_arn }}

      postgres_username: ${{ steps.terraform_outputs.outputs.postgres_username }}
     
      postgres_secret_arn: ${{ steps.terraform_outputs.outputs.postgres_secret_arn }}

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
      
      - name: Configure Kubeconfig
        run: |
          aws eks update-kubeconfig \
          --region ${{ env.AWS_REGION }} \
          --name ${{ env.CLUSTER_NAME }}


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Read Terraform Outputs
        id: terraform_outputs
        working-directory: terraform
        
        run: |
          terraform init -input=false

          echo "mysql_endpoint=$(terraform output -raw mysql_endpoint)" >> $GITHUB_OUTPUT

          echo "postgres_endpoint=$(terraform output -raw postgres_endpoint)" >> $GITHUB_OUTPUT

          echo "dynamodb_table=$(terraform output -raw dynamodb_table_name)" >> $GITHUB_OUTPUT

          echo "mysql_username=$(terraform output -raw mysql_username)" >> $GITHUB_OUTPUT

          echo "mysql_secret_arn=$(terraform output -raw mysql_secret_arn)" >> $GITHUB_OUTPUT

          echo "postgres_username=$(terraform output -raw postgres_username)" >> $GITHUB_OUTPUT
         
          echo "postgres_secret_arn=$(terraform output -raw postgres_secret_arn)" >> $GITHUB_OUTPUT

      - name: Verify Terraform Outputs
        run: |
          echo "MySQL Endpoint: ${{ steps.terraform_outputs.outputs.mysql_endpoint }}"
          echo "Postgres Endpoint: ${{ steps.terraform_outputs.outputs.postgres_endpoint }}"
          echo "DynamoDB Table: ${{ steps.terraform_outputs.outputs.dynamodb_table }}"

      - name: Ensure Application Namespace Exists
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl get ns ${{ env.NAMESPACE }}

  initialize-databases:
    timeout-minutes: 20
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    needs: validate-infrastructure

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .      

    env:
      MYSQL_ENDPOINT: ${{ needs.validate-infrastructure.outputs.mysql_endpoint }}
      POSTGRES_ENDPOINT: ${{ needs.validate-infrastructure.outputs.postgres_endpoint }}
      DYNAMODB_TABLE: ${{ needs.validate-infrastructure.outputs.dynamodb_table }}

      MYSQL_USERNAME: ${{ needs.validate-infrastructure.outputs.mysql_username }}

      MYSQL_SECRET_ARN: ${{ needs.validate-infrastructure.outputs.mysql_secret_arn }}

      POSTGRES_USERNAME: ${{ needs.validate-infrastructure.outputs.postgres_username }}

      POSTGRES_SECRET_ARN: ${{ needs.validate-infrastructure.outputs.postgres_secret_arn }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-DeployRetailStore

      - name: Read Database Secrets
        run: |
          set -euo pipefail

          echo "Reading MySQL secret..."

          MYSQL_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "$MYSQL_SECRET_ARN" \
            --query SecretString \
            --output text)

          echo "MYSQL_USERNAME=$(echo "$MYSQL_SECRET" | jq -r '.username')" >> $GITHUB_ENV
          echo "MYSQL_PASSWORD=$(echo "$MYSQL_SECRET" | jq -r '.password')" >> $GITHUB_ENV

          echo "Reading PostgreSQL secret..."

          POSTGRES_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "$POSTGRES_SECRET_ARN" \
            --query SecretString \
            --output text)

          echo "POSTGRES_USERNAME=$(echo "$POSTGRES_SECRET" | jq -r '.username')" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=$(echo "$POSTGRES_SECRET" | jq -r '.password')" >> $GITHUB_ENV
        
      - name: Verify Secrets Retrieval
        run: |
          echo "Checking jq installation..."
          jq --version

          echo "Checking that environment variables were populated..."

          if [ -z "$MYSQL_USERNAME" ]; then
            echo "MYSQL_USERNAME is empty"
            exit 1
          fi

          if [ -z "$MYSQL_PASSWORD" ]; then
            echo "MYSQL_PASSWORD is empty"
            exit 1
          fi

          if [ -z "$POSTGRES_USERNAME" ]; then
            echo "POSTGRES_USERNAME is empty"
            exit 1
          fi

          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "POSTGRES_PASSWORD is empty"
            exit 1
          fi

          echo "✅ Successfully retrieved both database secrets."


      - name: Configure Kubeconfig
        run: |
          aws eks update-kubeconfig \
          --region ${{ env.AWS_REGION }} \
          --name ${{ env.CLUSTER_NAME }}  

      - name: Initialize Catalog Database
        run: |
          kubectl delete pod mysql-init \
          -n ${{ env.NAMESPACE }} \
          --ignore-not-found=true

          kubectl wait \
          --for=delete pod/mysql-init \
          -n ${{ env.NAMESPACE }} \
          --timeout=120s || true
          
          kubectl run mysql-init -n ${{ env.NAMESPACE }} \
            --image=mysql:8 \
            --restart=Never \
            --env="MYSQL_PWD=${MYSQL_PASSWORD}" \
            --env="MYSQL_ENDPOINT=${MYSQL_ENDPOINT}" \
            --env="MYSQL_USERNAME=${MYSQL_USERNAME}" \
            --command -- \
            bash -c '
              HOST=$(echo "$MYSQL_ENDPOINT" | cut -d":" -f1)
              PORT=$(echo "$MYSQL_ENDPOINT" | cut -d":" -f2)

              mysql \
                -h "$HOST" \
                -P "$PORT" \
                -u "$MYSQL_USERNAME" \
                -e "CREATE DATABASE IF NOT EXISTS catalog;"
            '
        
            echo "Waiting for mysql-init pod to finish..."
            if ! kubectl wait \
              --for=jsonpath='{.status.phase}'=Succeeded \
              pod/mysql-init \
              -n ${{ env.NAMESPACE }} \
              --timeout=180s; then

              kubectl get pod mysql-init -n ${{ env.NAMESPACE }}
              kubectl describe pod mysql-init -n ${{ env.NAMESPACE }}
              kubectl logs mysql-init -n ${{ env.NAMESPACE }}

              exit 1
            fi

            kubectl get pod mysql-init \
              -n ${{ env.NAMESPACE }}

            kubectl describe pod mysql-init \
              -n ${{ env.NAMESPACE }}

            kubectl logs mysql-init \
              -n ${{ env.NAMESPACE }}

      - name: Initialize Orders Database
        run: |
            kubectl delete pod postgres-init \
            -n ${{ env.NAMESPACE }} \
            --ignore-not-found=true

            kubectl wait \
            --for=delete pod/postgres-init \
            -n ${{ env.NAMESPACE }} \
            --timeout=120s || true

            kubectl run postgres-init -n ${{ env.NAMESPACE }} \
              --image=postgres:15 \
              --restart=Never \
              --env="PGPASSWORD=${POSTGRES_PASSWORD}" \
              --env="POSTGRES_USERNAME=${POSTGRES_USERNAME}" \
              --env="POSTGRES_ENDPOINT=${POSTGRES_ENDPOINT}" \
                        --command -- \
              bash -c '
                HOST=$(echo "$POSTGRES_ENDPOINT" | cut -d":" -f1)
                PORT=$(echo "$POSTGRES_ENDPOINT" | cut -d":" -f2)

                EXISTS=$(psql \
                  -h "$HOST" \
                  -p "$PORT" \
                  -U "$POSTGRES_USERNAME" \
                  -d postgres \
                  -tAc "SELECT 1 FROM pg_database WHERE datname='\''orders'\''")

                if [ "$EXISTS" != "1" ]; then
                  echo "Creating orders database..."
                  psql \
                    -h "$HOST" \
                    -p "$PORT" \
                    -U "$POSTGRES_USERNAME" \
                    -d postgres \
                    -c "CREATE DATABASE orders;"

                else
                  echo "orders database already exists"
                fi
              '

            echo "Waiting for postgres-init pod to complete..."

            if ! kubectl wait \
              --for=jsonpath='{.status.phase}'=Succeeded \
              pod/postgres-init \
              -n ${{ env.NAMESPACE }} \
              --timeout=180s; then

              kubectl get pod postgres-init -n ${{ env.NAMESPACE }}
              kubectl describe pod postgres-init -n ${{ env.NAMESPACE }}
              kubectl logs postgres-init -n ${{ env.NAMESPACE }}

              exit 1
            fi

            kubectl get pod postgres-init \
              -n ${{ env.NAMESPACE }}

            kubectl describe pod postgres-init \
              -n ${{ env.NAMESPACE }}

            kubectl logs postgres-init \
              -n ${{ env.NAMESPACE }}    

  deploy-application:
    timeout-minutes: 30
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    needs: 
      - initialize-databases
      - validate-infrastructure

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
      
      - name: Configure Kubeconfig
        run: |
          aws eks update-kubeconfig \
          --region ${{ env.AWS_REGION }} \
          --name ${{ env.CLUSTER_NAME }}  

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Verify Helm Installation
        run: |
          helm version
          helm env

      - name: Install Helm Diff Plugin
        run: |
          helm plugin uninstall diff || true

          helm plugin install https://github.com/databus23/helm-diff --version v3.9.12

          helm plugin list

      - name: Install Helmfile
        run: |
          HELMFILE_VERSION=v0.170.1
          HELMFILE_VERSION_NO_V=${HELMFILE_VERSION#v}

          URL="https://github.com/helmfile/helmfile/releases/download/${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION_NO_V}_linux_amd64.tar.gz"

          echo "Downloading:"
          echo "$URL"

          curl -L -o helmfile.tar.gz "$URL"

          tar -xzf helmfile.tar.gz

          chmod +x helmfile

          sudo mv helmfile /usr/local/bin/

          helmfile --version


      - name: Verify Retail-store Files
        run: |
          pwd
          echo "Checking Retail Store directory..."
          ls -la retail-store-sample-app
          ls -la retail-store-sample-app/src
          ls -la retail-store-sample-app/src/app

      - name: Verify Helmfile
        working-directory: retail-store-sample-app/src/app
        run: |
          helmfile --version
          test -f helmfile.yaml
          echo "helmfile.yaml found"  

      - name: Load Database Passwords from Secrets Manager
        env:
          MYSQL_SECRET_ARN: ${{ needs.validate-infrastructure.outputs.mysql_secret_arn }}
          POSTGRES_SECRET_ARN: ${{ needs.validate-infrastructure.outputs.postgres_secret_arn }}
        run: |
          set -euo pipefail
          MYSQL_PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id "$MYSQL_SECRET_ARN" \
            --query SecretString \
            --output text | jq -r '.password')

          POSTGRES_PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id "$POSTGRES_SECRET_ARN" \
            --query SecretString \
            --output text | jq -r '.password')

          echo "MYSQL_PASSWORD=$MYSQL_PASSWORD" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> "$GITHUB_ENV"

          echo "✓ Database passwords loaded from AWS Secrets Manager"


      - name: Verify Helm Environment
        run: |
          set -e

          test -n "$MYSQL_PASSWORD"
          test -n "$POSTGRES_PASSWORD"

          echo "✓ Database passwords loaded successfully."


      - name: Deploy Retail Store
        working-directory: retail-store-sample-app/src/app
        env:
          MYSQL_ENDPOINT: ${{ needs.validate-infrastructure.outputs.mysql_endpoint }}
          POSTGRES_ENDPOINT: ${{ needs.validate-infrastructure.outputs.postgres_endpoint }}
          DYNAMODB_TABLE: ${{ needs.validate-infrastructure.outputs.dynamodb_table }}

          MYSQL_USERNAME: ${{ needs.validate-infrastructure.outputs.mysql_username }}

          POSTGRES_USERNAME: ${{ needs.validate-infrastructure.outputs.postgres_username }}
        

          INGRESS: "true"

        run: |
          helmfile --log-level debug apply

  verify-deployment:
    timeout-minutes: 20
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    needs: deploy-application

    runs-on: ubuntu-latest

    outputs:
      alb_dns: ${{ steps.alb.outputs.alb_dns }}

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
            
      - name: Configure Kubeconfig
        run: |
          aws eks update-kubeconfig \
          --region ${{ env.AWS_REGION }} \
          --name ${{ env.CLUSTER_NAME }}

      - name: Wait For Deployments
        run: |
          kubectl rollout status deployment/catalog -n ${{ env.NAMESPACE }} --timeout=10m 
          kubectl rollout status deployment/carts -n ${{ env.NAMESPACE }} --timeout=10m 
          kubectl rollout status deployment/orders -n ${{ env.NAMESPACE }} --timeout=10m 
          kubectl rollout status deployment/checkout -n ${{ env.NAMESPACE }} --timeout=10m 
          kubectl rollout status deployment/ui -n ${{ env.NAMESPACE }} --timeout=10m 

      - name: Show Pod Details
        if: always()
        run: |
          kubectl get pods -o wide -n ${{ env.NAMESPACE }}
          kubectl get deployments -n ${{ env.NAMESPACE }}   

      - name: Investigate Deployment State
        if: always()
        run: |
          echo "=== Namespaces ==="
          kubectl get ns ${{ env.NAMESPACE }}

          echo "=== Deployments ==="
          kubectl get deployments -n ${{ env.NAMESPACE }}

          echo "=== Pods ==="
          kubectl get pods -n ${{ env.NAMESPACE }}

          echo "=== Services ==="
          kubectl get svc -n ${{ env.NAMESPACE }}

          echo "=== Ingresses ==="
          kubectl get ingress -n ${{ env.NAMESPACE }}

          echo "=== Events ==="
          kubectl get events -n ${{ env.NAMESPACE }} --sort-by=.lastTimestamp | tail -50

      - name: Verify Ingress
        if: always()
        run: |
          kubectl get ingress ui -n ${{ env.NAMESPACE }}
          kubectl describe ingress ui -n ${{ env.NAMESPACE }} 
        
      - name: Get ALB DNS
        if: always()
        id: alb
        run: |
          echo "Waiting for ALB provisioning..."

          for i in {1..30}; do

            kubectl get ingress -n ${{ env.NAMESPACE }}

            ALB_DNS=$(kubectl get ingress ui -n ${{ env.NAMESPACE }} \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)

            if [ -n "$ALB_DNS" ]; then
              echo ""
              echo "===================================="
              echo "Retail Store URL:"
              echo "http://${ALB_DNS}"
              echo "===================================="

              echo "## Retail Store Deployment Successful 🚀" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Application URL:** http://${ALB_DNS}" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Deployment completed successfully." >> $GITHUB_STEP_SUMMARY
             
              echo "alb_dns=$ALB_DNS" >> "$GITHUB_OUTPUT"

              exit 0
            fi

            echo "ALB not ready yet... retrying in 20 seconds"
            sleep 20
          done

          echo "ERROR: ALB hostname was not assigned"
          kubectl describe ingress ui
          exit 1

  smoke-tests: 
      timeout-minutes: 10
      if: >
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      
      needs: verify-deployment

      runs-on: ubuntu-latest

      env:
        ALB_DNS: ${{ needs.verify-deployment.outputs.alb_dns }}

      defaults:
        run:
          working-directory: .

      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
            aws-region: ${{ vars.AWS_REGION }}
            audience: sts.amazonaws.com
      

        - name: Configure Kubeconfig
          run: |
            aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.CLUSTER_NAME }}
        
        - name: Smoke Test Application
          run: |
            echo "Testing application at http://${ALB_DNS}"

            for i in {1..10}; do
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${ALB_DNS}")

              if [ "$HTTP_STATUS" -eq 200 ]; then
                echo "Application is healthy."

                echo "alb_dns=$ALB_DNS" >> "$GITHUB_OUTPUT"

                exit 0
              fi

              echo "Waiting for application..."
              sleep 15
            done

            echo "Application never became healthy."
            exit 1
